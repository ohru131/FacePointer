<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コミュニケーションボード</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e63946'/%3E%3Cpath d='M20 34h24v6H20z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

</head>
<body>
    <div id="app">
        <!-- Face Tracking Background -->
        <div id="mirror-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas-overlay"></canvas>
        </div>
        <!-- Pointer lives above ALL layers -->
        <div id="pointer"></div>

        <!-- UI Layer -->
        <div id="ui-layer">

            <div id="mode-prompt" aria-live="polite"></div>


            <!-- 3 rows of 4 buttons each -->
            <div id="hierarchy-panel">
                <div class="row-label">① 大分類</div>
                <div id="row1" class="btn-row"></div>

                <div class="row-label">② 中分類</div>
                <div id="row2" class="btn-row"></div>

                <div class="row-label">③ 決定</div>
                <div id="row3" class="btn-row btn-row--confirm"></div>
            </div>
        </div>

        <!-- Confirm Overlay -->
        <div id="confirm-overlay">
            <div id="confirm-box">
                <div id="confirm-icon">✓</div>
                <div id="confirm-text"></div>
            </div>
        </div>

        <!-- Confirm Zone (bottom dwell area) -->
        <div id="confirm-zone">
            <div id="confirm-zone-inner">
                <span id="confirm-zone-icon">▼</span>
                <span id="confirm-zone-label">ここで確定</span>
                <span id="confirm-zone-preview"></span>
            </div>
            <div id="confirm-zone-progress"><div id="confirm-zone-bar"></div></div>
        </div>

        <!-- Gesture Indicator -->
        <div id="gesture-indicator"></div>

        <!-- Controls (bottom right) -->
        <div id="controls">
            <div id="controls-top">
                <button id="settings-btn" class="ctrl-btn icon-btn" title="設定">⚙️</button>
                <button id="audio-cache-btn" class="ctrl-btn secondary">音声データを更新</button>
                <button id="calibrate-btn" class="ctrl-btn">校正リセット</button>
                <div id="audio-status" class="status-info" style="display:none;">
                    <div class="status-label"></div>
                    <div class="status-progress-bar">
                        <div class="status-progress-fill"></div>
                    </div>
                </div>
            </div>
            <div id="controls-bottom">
                <div id="telemetry-panel">
                    <pre id="telemetry-values">計測待機中</pre>
                </div>
                <div id="quick-tuning" aria-label="調整スライダー">
                    <div class="compact-slider-item">
                        <label for="jaw-open-threshold-slider">口の開き <span id="jaw-open-threshold-value">0.10</span></label>
                        <input type="range" id="jaw-open-threshold-slider" min="0.00" max="0.20" step="0.01" value="0.10">
                    </div>
                    <div class="compact-slider-item">
                        <label for="nose-gain-slider">鼻位置移動 <span id="nose-gain-value">10.0</span></label>
                        <input type="range" id="nose-gain-slider" min="0" max="20" step="0.5" value="10">
                    </div>
                    <div class="compact-slider-item">
                        <label for="yaw-gain-slider">顔の傾き <span id="yaw-gain-value">10.0</span></label>
                        <input type="range" id="yaw-gain-slider" min="0" max="20" step="0.5" value="10">
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content" style="max-width: 700px; max-height: 85vh; overflow-y: auto;">
                <h3>設定</h3>
                
                <!-- Tabs -->
                <div class="settings-tabs">
                    <button class="settings-tab-btn active" data-tab="api-tab">API設定</button>
                    <button class="settings-tab-btn" data-tab="phrase-tab">セリフ編集</button>
                </div>

                <!-- API Tab -->
                <div id="api-tab" class="settings-tab-content active">
                    <div class="setting-item">
                        <label for="mode-select">操作モード</label>
                        <select id="mode-select">
                            <option value="symptom-relative">新モード（横移動）</option>
                            <option value="symptom">症状モード</option>
                            <option value="hierarchy">階層モード</option>
                        </select>
                        <small>調整スライダーはメイン画面右下で即時反映されます。</small>
                    </div>
                    <div class="setting-item">
                        <label for="icon-style-select">アイコンスタイル</label>
                        <select id="icon-style-select">
                            <option value="simple">シンプル（ピクトグラム）</option>
                            <option value="cute">かわいい（イラスト）</option>
                            <option value="comic">ヒーロー（イラスト）</option>
                            <option value="comic2">ヒーロー2（イラスト）</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="api-key-input">Gemini API Key (Google Cloud TTS用):</label>
                        <input type="text" id="api-key-input" placeholder="AIZA...">
                        <small>※ブラウザに保存されます</small>
                    </div>
                    <div class="setting-item" style="margin-top: 15px;">
                        <label>マウスクリックで話す文言:</label>
                        <div class="mouse-speech-grid">
                            <input type="text" id="mouse-left-input" placeholder="左クリックの文言">
                            <input type="text" id="mouse-middle-input" placeholder="真ん中クリックの文言">
                            <input type="text" id="mouse-right-input" placeholder="右クリックの文言">
                        </div>
                        <small>※ 左/真ん中/右クリックで即時発話されます</small>
                    </div>
                </div>

                <!-- Phrase Tab -->
                <div id="phrase-tab" class="settings-tab-content">
                    <div class="phrase-editor-toolbar">
                        <input id="phrase-search-input" type="text" placeholder="分類名・ボタン名・発話文で検索">
                        <div class="phrase-editor-toolbar-actions">
                            <button id="phrase-expand-all" class="ctrl-btn secondary" type="button">全展開</button>
                            <button id="phrase-collapse-all" class="ctrl-btn secondary" type="button">全折りたたみ</button>
                            <button id="phrase-clear-search" class="ctrl-btn secondary" type="button">検索クリア</button>
                        </div>
                    </div>
                    <div id="phrase-editor-summary" class="phrase-editor-summary"></div>
                    <div id="phrase-editor-container" style="display: grid; grid-template-columns: 1fr; gap: 1.5rem;"></div>
                    <div id="phrase-synthesis-status" class="status-info" style="display:none; margin-top: 1rem;">
                        <div class="status-label"></div>
                        <div class="status-progress-bar">
                            <div class="status-progress-fill"></div>
                        </div>
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                        <button id="prefetch-modified-btn" class="ctrl-btn primary">修正済みセリフのみ再合成</button>
                        <button id="reset-phrases-btn" class="ctrl-btn secondary">修正内容をリセット</button>
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 15px;">
                    <button id="save-settings" class="ctrl-btn primary">保存して閉じる</button>
                    <button id="close-settings" class="ctrl-btn secondary">キャンセル</button>
                </div>
            </div>
        </div>

        <div id="mouse-click-feedback" aria-live="polite"></div>

        <div id="loading">
            <div class="loader"></div>
            <p>モデルを読み込み中...</p>
        </div>
    </div>
    <script src="app.js" type="module"></script>
</body>
</html>
