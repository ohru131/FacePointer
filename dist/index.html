<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コミュニケーションボード</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

</head>
<body>
    <div id="app">
        <!-- Face Tracking Background -->
        <div id="mirror-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas-overlay"></canvas>
        </div>
        <!-- Pointer lives above ALL layers -->
        <div id="pointer"></div>

        <!-- UI Layer -->
        <div id="ui-layer">


            <!-- 3 rows of 4 buttons each -->
            <div id="hierarchy-panel">
                <div class="row-label">① 大分類</div>
                <div id="row1" class="btn-row"></div>

                <div class="row-label">② 中分類</div>
                <div id="row2" class="btn-row"></div>

                <div class="row-label">③ 決定</div>
                <div id="row3" class="btn-row btn-row--confirm"></div>
            </div>
        </div>

        <!-- Confirm Overlay -->
        <div id="confirm-overlay">
            <div id="confirm-box">
                <div id="confirm-icon">✓</div>
                <div id="confirm-text"></div>
            </div>
        </div>

        <!-- Confirm Zone (bottom dwell area) -->
        <div id="confirm-zone">
            <div id="confirm-zone-inner">
                <span id="confirm-zone-icon">▼</span>
                <span id="confirm-zone-label">ここで確定</span>
                <span id="confirm-zone-preview"></span>
            </div>
            <div id="confirm-zone-progress"><div id="confirm-zone-bar"></div></div>
        </div>

        <!-- Gesture Indicator -->
        <div id="gesture-indicator"></div>

        <!-- Controls (moved to bottom right in CSS) -->
        <div id="controls">
            <button id="settings-btn" class="ctrl-btn icon-btn" title="設定">⚙️</button>
            <button id="audio-cache-btn" class="ctrl-btn secondary">音声データを更新</button>
            <button id="calibrate-btn" class="ctrl-btn">校正リセット</button>
            <div id="audio-status" class="status-info" style="display:none;"></div>
            <div class="control-item">
                <span>感度</span>
                <input type="range" id="sensitivity-slider" min="1" max="10" step="0.5" value="4">
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content" style="max-width: 600px;">
                <h3>設定</h3>
                <div class="setting-item">
                    <label for="api-key-input">Gemini API Key (Google Cloud TTS用):</label>
                    <input type="text" id="api-key-input" placeholder="AIZA...">
                    <small>※ブラウザに保存されます</small>
                </div>
                <div class="setting-item" style="margin-top: 15px;">
                    <label for="hierarchy-input">階層メニューの編集 (hierarchy.txt):</label>
                    <textarea id="hierarchy-input" rows="8" style="width:100%; font-family:monospace; margin-top:5px; resize:vertical;"></textarea>
                    <small>※「保存して閉じる」を押すと更新され、アプリに即座に反映されます</small>
                </div>
                <div class="modal-actions" style="margin-top: 15px;">
                    <button id="save-settings" class="ctrl-btn primary">保存して閉じる</button>
                    <button id="close-settings" class="ctrl-btn secondary">キャンセル</button>
                </div>
            </div>
        </div>

        <div id="loading">
            <div class="loader"></div>
            <p>モデルを読み込み中...</p>
        </div>
    </div>
    <script src="app.js" type="module"></script>
</body>
</html>
