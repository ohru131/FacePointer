        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#halo)">
    <circle cx="19" cy="32" r="13" fill="none" stroke="#DC2626" stroke-width="6"/>
    <path d="M37 19l20 26m0-26L37 45" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
