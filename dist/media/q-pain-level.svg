<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#halo)">
    <rect x="6" y="38" width="10" height="18" rx="3" fill="#22C55E" stroke="#15803D" stroke-width="2.6"/>
    <rect x="20" y="28" width="10" height="28" rx="3" fill="#EAB308" stroke="#A16207" stroke-width="2.6"/>
    <rect x="34" y="18" width="10" height="38" rx="3" fill="#F97316" stroke="#C2410C" stroke-width="2.6"/>
    <rect x="48" y="7" width="10" height="49" rx="3" fill="#EF4444" stroke="#991B1B" stroke-width="2.6"/>
  </g>
</svg>
