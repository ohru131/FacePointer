<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#halo)">
    <circle cx="32" cy="32" r="25" fill="#22C55E" stroke="#15803D" stroke-width="3.5"/>
    <path d="M18 32.5l9.5 9.5 19-20" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
